name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches Cargo.toml version
        run: |
          # GITHUB_REF_NAME is e.g. "v0.2.1"; strip the leading v.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Extract [package] version without depending on jq/cargo-metadata.
          CARGO_VERSION=$(grep -E '^version = "[0-9]+\.[0-9]+\.[0-9]+"$' Cargo.toml \
            | head -n 1 | sed -E 's/^version = "(.*)"$/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match Cargo.toml [package] version '$CARGO_VERSION'"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches Cargo.toml version $CARGO_VERSION"

  build-linux:
    needs: verify-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: dvlpr-x86_64-linux.tar.gz
          - target: aarch64-unknown-linux-gnu
            asset: dvlpr-aarch64-linux.tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Install libclang (bindgen requirement)
        run: sudo apt-get update -qq && sudo apt-get install -y libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Zig 0.15.2
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/zig-x86_64-linux-0.15.2
          key: zig-0.15.2-x86_64-linux
      - name: Install Zig 0.15.2
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          mkdir -p ~/.local
          tar -xf /tmp/zig.tar.xz -C ~/.local/
      - name: Expose Zig on PATH and as both env vars
        run: |
          ZIG_DIR="$HOME/.local/zig-x86_64-linux-0.15.2"
          echo "$ZIG_DIR" >> $GITHUB_PATH
          echo "ZIG=$ZIG_DIR/zig" >> $GITHUB_ENV
          echo "CARGO_ZIGBUILD_ZIG_PATH=$ZIG_DIR/zig" >> $GITHUB_ENV
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ${{ matrix.asset }} dvlpr
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          mv ${{ matrix.asset }} ${{ matrix.asset }}.sha256 "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  build-macos:
    needs: verify-tag
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: dvlpr-aarch64-macos.tar.gz
          - target: x86_64-apple-darwin
            asset: dvlpr-x86_64-macos.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Zig 0.15.2
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/zig-aarch64-macos-0.15.2
          key: zig-0.15.2-aarch64-macos
      - name: Install Zig 0.15.2
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz
          mkdir -p ~/.local
          tar -xf /tmp/zig.tar.xz -C ~/.local/
      - name: Expose Zig
        run: |
          ZIG_DIR="$HOME/.local/zig-aarch64-macos-0.15.2"
          echo "$ZIG_DIR" >> $GITHUB_PATH
          echo "ZIG=$ZIG_DIR/zig" >> $GITHUB_ENV
      - name: Build (native cargo, NOT cargo-zigbuild — libghostty-vt links Apple frameworks)
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ${{ matrix.asset }} dvlpr
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          mv ${{ matrix.asset }} ${{ matrix.asset }}.sha256 "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dvlpr-*.tar.gz
            dist/dvlpr-*.tar.gz.sha256
          generate_release_notes: true
