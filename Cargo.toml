[package]
name = "dvlpr"
version = "0.5.0"
edition = "2021"
build = "build.rs"
description = "lightweight agent-aware terminal multiplexer"
license = "MIT"
repository = "https://github.com/alkeincodes/dvlpr"
homepage = "https://github.com/alkeincodes/dvlpr"
readme = "README.md"
keywords = ["terminal", "multiplexer", "tmux", "agents", "ai"]
categories = ["command-line-utilities"]

[lib]
name = "dvlpr"
path = "src/lib.rs"

[[bin]]
name = "dvlpr"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "net", "signal"] }
portable-pty = "0.9"
crossterm = "0.29"
bincode = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
bindgen = "0.72"
